services:
  postgres:
    image: postgres:16-alpine
    container_name: voclab-postgres
    environment:
      POSTGRES_USER: voclab
      POSTGRES_PASSWORD: voclab123
      POSTGRES_DB: voclab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
